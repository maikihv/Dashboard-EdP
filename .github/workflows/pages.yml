name: Deploy Dashboard EdP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          python -m pip install --quiet brotli
          python - <<'PY'
          import base64, brotli
          from pathlib import Path
          parts = [
              "dashboard.part-00",
              "dashboard.part-01-0",
              "dashboard.part-01-1",
              "dashboard.part-01-2",
              "dashboard.part-01-3",
              "dashboard.part-02-0",
              "dashboard.part-02-1",
              "dashboard.part-02-2",
              "dashboard.part-02-3",
              "dashboard.part-03",
          ]
          src = "".join(Path(p).read_text().strip() for p in parts)
          html = brotli.decompress(base64.b64decode(src))
          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_bytes(html)
          print(f"Built index.html: {len(html)} bytes")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
