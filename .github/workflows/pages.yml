name: Deploy Dashboard EdP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          python -m pip install --quiet brotli
          python - <<'PY'
          import base64, brotli
          from pathlib import Path

          prefix_parts = [
              "dashboard.part-00",
              "dashboard.part-01-0",
              "dashboard.part-01-1",
              "dashboard.part-01-2",
              "dashboard.part-01-3",
          ]
          suffix = Path("dashboard.part-03").read_text().strip()
          middle = Path("dashboard.part-02").read_text().strip()
          prefix = "".join(Path(p).read_text().strip() for p in prefix_parts)

          def unpack(src):
              return brotli.decompress(base64.b64decode(src))

          try:
              html = unpack(prefix + middle + suffix)
          except brotli.error:
              # The uploaded middle chunk contains one accidental extra base64
              # character. Repair it deterministically by finding the single
              # deletion that recreates the valid Brotli stream.
              html = None
              for i in range(len(middle)):
                  candidate = prefix + middle[:i] + middle[i+1:] + suffix
                  try:
                      html = unpack(candidate)
                      print(f"Repaired dashboard.part-02 by removing character at {i}")
                      break
                  except Exception:
                      pass
              if html is None:
                  raise RuntimeError("Could not reconstruct dashboard bundle")

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_bytes(html)
          print(f"Built index.html: {len(html)} bytes")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
